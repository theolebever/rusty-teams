# Packages Rune for Windows. Tests live in test.yml.
name: Build

# Main pushes produce portable artifacts; tags also produce the Windows installer.
# A `v*` tag also publishes a GitHub release; a tag with `-` (v0.2.0-rc.1) is a pre-release.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/readme/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build
          # Tag and branch runs restore main's cache but never save their own: the
          # repository's 10 GB cache quota only holds one cache per job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-windows
        with:
          gpui-patches: 'false'

      - name: Build
        run: cargo build -p app-rune --release --locked

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: teams-windows-amd64-portable
          path: target/release/rusty-teams-rune.exe
          if-no-files-found: error

      - name: Installer
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:RELEASE_TAG -replace '^v', ''
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceExe=$env:GITHUB_WORKSPACE/target/release/rusty-teams-rune.exe" `
            "/O$env:GITHUB_WORKSPACE/target/installer" `
            scripts/windows-installer.iss

      - name: Upload installer
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: teams-windows-amd64-setup
          path: target/installer/rusty-teams-setup.exe
          if-no-files-found: error

  release:
    name: Release
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp dist/teams-windows-amd64-portable/rusty-teams-rune.exe "release/rusty-teams-$TAG-windows-amd64-portable.exe"
          cp dist/teams-windows-amd64-setup/rusty-teams-setup.exe "release/rusty-teams-$TAG-windows-amd64-setup.exe"

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
