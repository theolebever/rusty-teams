# Packages Rune on Linux, Windows and macOS. Tests live in test.yml.
name: Build

# Main pushes produce portable artifacts; tags also produce the Windows installer.
# A `v*` tag also publishes a GitHub release; a tag with `-` (v0.2.0-rc.1) is a pre-release.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/readme/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # webrtc-sys compiles its C++ against the hermetic libc++ inside the libwebrtc
    # artifact, which needs a clang as new as that libc++ (clang 21 today, see
    # check_clang_version in vendor/webrtc-sys/build.rs). The distro clang is older
    # (18 on ubuntu-24.04), so setup-linux installs clang 21 and these point every
    # compile and the final link at it.
    env:
      CC: clang-21
      CXX: clang++-21
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang-21
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-linux

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build
          # Tag and branch runs restore main's cache but never save their own: the
          # repository's 10 GB cache quota only holds one cache per job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build -p app-rune --release --locked

      # The runner is x86_64; the artifact name carries the architecture.
      - uses: actions/upload-artifact@v7
        with:
          name: teams-linux-amd64
          path: target/release/rusty-teams-rune
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    # rust-lld links much faster than link.exe on a binary this size.
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build
          # Tag and branch runs restore main's cache but never save their own: the
          # repository's 10 GB cache quota only holds one cache per job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/setup-windows
        with:
          gpui-patches: 'false'

      - name: Build
        run: cargo build -p app-rune --release --locked

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: teams-windows-amd64-portable
          path: target/release/rusty-teams-rune.exe
          if-no-files-found: error

      - name: Installer
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:RELEASE_TAG -replace '^v', ''
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceExe=$env:GITHUB_WORKSPACE/target/release/rusty-teams-rune.exe" `
            "/O$env:GITHUB_WORKSPACE/target/installer" `
            scripts/windows-installer.iss

      - name: Upload installer
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: teams-windows-amd64-setup
          path: target/installer/rusty-teams-setup.exe
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build
          # Tag and branch runs restore main's cache but never save their own: the
          # repository's 10 GB cache quota only holds one cache per job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The script wraps the binary in a .app. Tags build the universal (arm64 +
      # x86_64) binary; other runs build arm64 only, which halves the job.
      - name: Build
        env:
          MACOS_TARGETS: ${{ github.ref_type == 'tag' && 'aarch64-apple-darwin x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
        run: scripts/build-macos.sh crates/app-rune rusty-teams-rune

      - uses: actions/upload-artifact@v7
        with:
          name: teams-macos
          path: target/universal/release/teams-macos.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      # Artifacts drop the executable bit, the tarball restores it.
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          chmod +x dist/teams-linux-amd64/rusty-teams-rune
          tar -czf "release/rusty-teams-$TAG-linux-amd64.tar.gz" -C dist/teams-linux-amd64 rusty-teams-rune
          cp dist/teams-windows-amd64-portable/rusty-teams-rune.exe "release/rusty-teams-$TAG-windows-amd64-portable.exe"
          cp dist/teams-windows-amd64-setup/rusty-teams-setup.exe "release/rusty-teams-$TAG-windows-amd64-setup.exe"
          cp dist/teams-macos/teams-macos.zip "release/rusty-teams-$TAG-macos-universal.zip"

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
