# Tests per README "Quick start": `cargo test`, on Windows, the target this fork focuses on.
name: Test

# Tests gate pushes to main; releases build from tags in build.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/readme/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          # Tag and branch runs restore main's cache but never save their own: the
          # repository's 10 GB cache quota only holds one cache per job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # After the toolchain: staging runs `cargo metadata`.
      - uses: ./.github/actions/setup-windows

      - name: Tests
        run: cargo test --config "patch.crates-io.gpui-pre-windows.path=\"$GPUI_PRE_WINDOWS_PATCHED\""
